<h2>Course List</h2>
<input
  [(ngModel)]="searchTerm"
  placeholder="Search courses..."
  (keyup.enter)="onSearch()"
/>
<button (click)="onSearch()">Search</button>
<div
  *ngFor="let c of courses"
  class="course-item"
  (click)="onCourseClick(c.id)"
>
  <h3>{{ c.name }}</h3>
  <p>{{ c.code }}</p>
</div>
