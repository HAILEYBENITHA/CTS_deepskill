<h2>Enrollment Request Form</h2>

<form
  #enrollForm="ngForm"
  (ngSubmit)="onSubmit(enrollForm)"
  (reset)="onReset(enrollForm)"
>
  <!-- studentName: required + minlength(3) -->
  <label>
    Student Name:
    <input
      type="text"
      name="studentName"
      [(ngModel)]="enrollment.studentName"
      #nameCtrl="ngModel"
      required
      minlength="3"
    />
  </label>
  <span
    *ngIf="nameCtrl.touched && nameCtrl.errors?.required"
    class="error"
  >
    Name is required.
  </span>
  <span
    *ngIf="nameCtrl.touched && nameCtrl.errors?.minlength"
    class="error"
  >
    Name must be at least 3 characters.
  </span>

  <!-- studentEmail: required + email -->
  <label>
    Student Email:
    <input
      type="email"
      name="studentEmail"
      [(ngModel)]="enrollment.studentEmail"
      #emailCtrl="ngModel"
      required
      email
    />
  </label>
  <span
    *ngIf="emailCtrl.touched && emailCtrl.errors?.required"
    class="error"
  >
    Email is required.
  </span>
  <span
    *ngIf="emailCtrl.touched && emailCtrl.errors?.email"
    class="error"
  >
    Please enter a valid email.
  </span>

  <!-- courseId: required (number) -->
  <label>
    Course ID:
    <input
      type="number"
      name="courseId"
      [(ngModel)]="enrollment.courseId"
      #courseCtrl="ngModel"
      required
    />
  </label>
  <span
    *ngIf="courseCtrl.touched && courseCtrl.errors?.required"
    class="error"
  >
    Course ID is required.
  </span>

  <!-- preferredSemester: select -->
  <label>
    Preferred Semester:
    <select
      name="preferredSemester"
      [(ngModel)]="enrollment.preferredSemester"
    >
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </label>

  <!-- agreeToTerms: checkbox required -->
  <label>
    <input
      type="checkbox"
      name="agreeToTerms"
      [(ngModel)]="enrollment.agreeToTerms"
      #termsCtrl="ngModel"
      required
    />
    I agree to the terms
  </label>
  <span
    *ngIf="termsCtrl.touched && termsCtrl.errors?.required"
    class="error"
  >
    You must agree to the terms.
  </span>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <button type="button" (click)="onReset(enrollForm)">Reset</button>

  <!-- Success message -->
  <div *ngIf="submitted" class="success">
    Enrollment request submitted successfully!
  </div>
</form>
