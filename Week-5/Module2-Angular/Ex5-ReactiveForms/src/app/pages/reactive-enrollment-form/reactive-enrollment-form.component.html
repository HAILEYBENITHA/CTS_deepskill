<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  <label>
    Student Name:
    <input type="text" formControlName="studentName" />
  </label>
  <span
    *ngIf="
      enrollForm.get('studentName')?.touched &&
      enrollForm.get('studentName')?.errors?.required
    "
    class="error"
  >
    Name is required.
  </span>
  <span
    *ngIf="
      enrollForm.get('studentName')?.touched &&
      enrollForm.get('studentName')?.errors?.minlength
    "
    class="error"
  >
    Name must be at least 3 characters.
  </span>

  <label>
    Student Email:
    <input type="email" formControlName="studentEmail" />
  </label>
  <span
    *ngIf="
      enrollForm.get('studentEmail')?.touched &&
      enrollForm.get('studentEmail')?.errors?.required
    "
    class="error"
  >
    Email is required.
  </span>
  <span
    *ngIf="
      enrollForm.get('studentEmail')?.touched &&
      enrollForm.get('studentEmail')?.errors?.email
    "
    class="error"
  >
    Please enter a valid email.
  </span>
  <span
    *ngIf="
      enrollForm.get('studentEmail')?.errors?.['emailTaken']
    "
    class="error"
  >
    Email is already taken.
  </span>

  <label>
    Course ID:
    <input type="text" formControlName="courseId" />
  </label>
  <span
    *ngIf="
      enrollForm.get('courseId')?.touched &&
      enrollForm.get('courseId')?.errors?.required
    "
    class="error"
  >
    Course ID is required.
  </span>
  <span
    *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']"
    class="error"
  >
    Course code starting with XX is not allowed.
  </span>

  <label>
    Preferred Semester:
    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </label>

  <label>
    <input type="checkbox" formControlName="agreeToTerms" />
    I agree to the terms
  </label>
  <span
    *ngIf="
      enrollForm.get('agreeToTerms')?.touched &&
      enrollForm.get('agreeToTerms')?.errors?.required
    "
    class="error"
  >
    You must agree to the terms.
  </span>

  <!-- FormArray for additional courses -->
  <div formArrayName="additionalCourses">
    <div
      *ngFor="let ctrl of additionalCourses.controls; let i = index"
    >
      <input [formControl]="ctrl" placeholder="Additional Course ID" />
      <button type="button" (click)="removeCourse(i)">Remove</button>
    </div>
  </div>
  <button type="button" (click)="addCourse()">Add Another Course</button>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
</form>
